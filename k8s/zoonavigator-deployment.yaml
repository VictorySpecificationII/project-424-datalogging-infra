apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.yaml convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: zoonavigator
  name: zoonavigator
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: zoonavigator
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.yaml convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: zoonavigator
    spec:
      containers:
        - env:
            - name: CONNECTION_LOCALZK_CONN
              value: zookeeper:2181
            - name: CONNECTION_LOCALZK_NAME
              value: Local ZooKeeper
            - name: HTTP_PORT
              value: "9000"
          image: elkozmon/zoonavigator:latest
          name: zoonavigator
          ports:
            - containerPort: 9000
              protocol: TCP
          resources:
            limits:
              memory: "536870912"
      restartPolicy: Always

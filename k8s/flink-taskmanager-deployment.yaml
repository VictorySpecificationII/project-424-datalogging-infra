apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.yaml convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: flink-taskmanager
  name: flink-taskmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flink-taskmanager
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.yaml convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: flink-taskmanager
    spec:
      containers:
        - args:
            - taskmanager
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: flink-jobmanager
          image: flink-taskmanager
          name: flink-taskmanager
          ports:
            - containerPort: 6122
              protocol: TCP
            - containerPort: 6121
              protocol: TCP
          resources:
            limits:
              memory: "536870912"
      restartPolicy: Always

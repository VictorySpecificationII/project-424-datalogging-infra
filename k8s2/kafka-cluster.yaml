apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: perrinn-424-rt-streaming
spec:
  clusterIP: None             # headless service for StatefulSet
  ports:
    - name: broker
      port: 9092
  selector:
    app: kafka

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: perrinn-424-rt-streaming
spec:
  serviceName: "kafka"
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.3.2
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper.perrinn-424-rt-streaming.svc.cluster.local:2181"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        command: ["/bin/sh", "-c"]
        args:
          - |
            export KAFKA_BROKER_ID=${HOSTNAME##*-} && \
            export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka.perrinn-424-rt-streaming.svc.cluster.local:9092" && \
            /etc/confluent/docker/run
      terminationGracePeriodSeconds: 30

  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

apiVersion: v1
kind: Service
metadata:
  name: kafka-svc
  namespace: perrinn-424-rt-streaming
  labels:
    app: kafka-app
spec:
  clusterIP: None        # headless service for StatefulSet
  ports:
    - name: broker
      port: 9092
      protocol: TCP
      targetPort: 9092
  selector:
    app: kafka-app

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: perrinn-424-rt-streaming
  labels:
    app: kafka-app
spec:
  serviceName: kafka-svc
  replicas: 3
  selector:
    matchLabels:
      app: kafka-app
  template:
    metadata:
      labels:
        app: kafka-app
    spec:
      containers:
        - name: kafka
          image: doughgle/kafka-kraft:latest
          ports:
            - containerPort: 9092
          env:
            - name: REPLICAS
              value: "3"
            - name: SERVICE
              value: kafka-svc
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SHARE_DIR
              value: /mnt/kafka
            - name: CLUSTER_ID
              value: oh-sxaDRTcyAr6pFRbXyzA  # pre-generated cluster ID
            - name: DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: DEFAULT_MIN_INSYNC_REPLICAS
              value: "2"
          volumeMounts:
            - name: kafka-data
              mountPath: /mnt/kafka
      terminationGracePeriodSeconds: 30

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
